name: Build desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libfuse2 patchelf
      - run: ./packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-AppImage-x86_64
          path: dist/*.AppImage

  macos-dmg:
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true
      - run: brew install ninja
      - run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG-${{ matrix.arch }}
          path: dist/*.dmg
